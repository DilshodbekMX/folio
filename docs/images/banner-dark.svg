<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Folio — self-hosted collaborative LaTeX">
  <title>Folio — self-hosted collaborative LaTeX</title>
  <defs>
    <linearGradient id="folio-bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a15"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101d17"/>
    </linearGradient>
    <linearGradient id="folio-tile-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9c66"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#folio-bg-d)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#25352d"/>

  <!-- source + PDF motif -->
  <g opacity="0.95">
    <rect x="726" y="86" width="196" height="128" rx="10" fill="#131d18" stroke="#283a31"/>
    <rect x="726" y="86" width="196" height="26" rx="10" fill="#18261f"/>
    <rect x="726" y="103" width="196" height="9" fill="#18261f"/>
    <circle cx="742" cy="99" r="3.5" fill="#3a5347"/>
    <circle cx="754" cy="99" r="3.5" fill="#3a5347"/>
    <circle cx="766" cy="99" r="3.5" fill="#3a5347"/>
    <g fill="#4fbd87">
      <rect x="742" y="128" width="58" height="7" rx="3.5"/>
      <rect x="742" y="162" width="46" height="7" rx="3.5"/>
    </g>
    <g fill="#42574c">
      <rect x="806" y="128" width="74" height="7" rx="3.5"/>
      <rect x="742" y="145" width="122" height="7" rx="3.5"/>
      <rect x="794" y="162" width="88" height="7" rx="3.5"/>
      <rect x="742" y="179" width="104" height="7" rx="3.5"/>
      <rect x="742" y="196" width="64" height="7" rx="3.5"/>
    </g>

    <!-- a collaborator's caret in the source -->
    <rect x="868" y="141" width="2.6" height="17" rx="1.3" fill="#e07b45"/>
    <rect x="868" y="126" width="48" height="13" rx="3" fill="#e07b45"/>
    <rect x="874" y="131" width="26" height="4" rx="2" fill="#ffffff" opacity="0.92"/>

    <path d="M938 150h28" fill="none" stroke="#4a6d5b" stroke-width="3" stroke-linecap="round"/>
    <path d="M960 143l8 7-8 7" fill="none" stroke="#4a6d5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="984" y="66" width="152" height="168" rx="8" fill="#e9efeb" stroke="#2c3f36"/>
    <rect x="1010" y="90" width="100" height="9" rx="4.5" fill="#33413a"/>
    <rect x="1030" y="107" width="60" height="6" rx="3" fill="#9aada3"/>
    <g fill="#c3cfc8">
      <rect x="1004" y="130" width="112" height="6" rx="3"/>
      <rect x="1004" y="143" width="112" height="6" rx="3"/>
      <rect x="1004" y="156" width="86" height="6" rx="3"/>
    </g>
    <rect x="1028" y="176" width="64" height="16" rx="4" fill="#d5e0d9"/>
    <path d="M1036 184h12m6-6v12m8-6h12" fill="none" stroke="#6f8d7c" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#c3cfc8">
      <rect x="1004" y="206" width="112" height="6" rx="3"/>
      <rect x="1004" y="219" width="74" height="6" rx="3"/>
    </g>
  </g>

  <!-- logo -->
  <g transform="translate(96,102) scale(3)">
    <rect width="32" height="32" rx="7.5" fill="url(#folio-tile-d)"/>
    <path d="M7.5 24.5C7.5 14.6 13.4 8.1 24.5 7.5C24.5 18.3 18.2 24.3 7.5 24.5Z" fill="#ffffff"/>
    <path d="M7.5 24.5L19 13" fill="none" stroke="#1f7a4d" stroke-width="1.9" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="228" y="152" font-size="76" font-weight="700" letter-spacing="-2" fill="#eaf5ee">Folio</text>
    <text x="231" y="196" font-size="25" font-weight="500" letter-spacing="0.2" fill="#93ab9e">Self-hosted collaborative LaTeX</text>
  </g>
  <rect x="231" y="216" width="62" height="4" rx="2" fill="#4fbd87"/>
</svg>
